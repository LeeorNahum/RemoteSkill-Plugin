name: Release

# The publish workflow pushes a release tag with the commit that changed the version on main. This
# attaches the plugin as one ZIP, with its descriptors at the root, and the ZIP's SHA-256.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is main's tip and the plugin's version
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = "$(git rev-parse "origin/main^{commit}")"
          version="$(jq -r .version plugin.json)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Archive the plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip -o "dist/remoteskill-${VERSION}.zip" HEAD -- . ':!.github'
          cd dist
          sha256sum "remoteskill-${VERSION}.zip" > "remoteskill-${VERSION}.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/remoteskill-${VERSION}.zip" \
            "dist/remoteskill-${VERSION}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "RemoteSkill ${GITHUB_REF_NAME}"
